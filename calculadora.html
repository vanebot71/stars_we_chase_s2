<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora</title>
<style>
  body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background:#222; font-family:sans-serif; }
  .calc { background:#333; padding:16px; border-radius:12px; width:280px; box-shadow:0 4px 16px #0008; }
  #pantalla { width:100%; box-sizing:border-box; height:56px; font-size:28px; text-align:right; padding:0 10px; border:none; border-radius:8px; background:#111; color:#fff; margin-bottom:12px; }
  .teclas { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { height:56px; font-size:20px; border:none; border-radius:8px; background:#555; color:#fff; cursor:pointer; }
  button:hover { background:#666; }
  button.op { background:#f59e0b; }
  button.op:hover { background:#fbbf24; }
  button.clr { background:#dc2626; }
  button.igual { background:#16a34a; grid-column:span 2; }
</style>
</head>
<body>
<div class="calc">
  <input id="pantalla" type="text" value="0" readonly>
  <div class="teclas">
    <button class="clr" onclick="limpiar()">C</button>
    <button onclick="borrar()">⌫</button>
    <button class="op" onclick="agregar('%')">%</button>
    <button class="op" onclick="agregar('/')">÷</button>
    <button onclick="agregar('7')">7</button>
    <button onclick="agregar('8')">8</button>
    <button onclick="agregar('9')">9</button>
    <button class="op" onclick="agregar('*')">×</button>
    <button onclick="agregar('4')">4</button>
    <button onclick="agregar('5')">5</button>
    <button onclick="agregar('6')">6</button>
    <button class="op" onclick="agregar('-')">−</button>
    <button onclick="agregar('1')">1</button>
    <button onclick="agregar('2')">2</button>
    <button onclick="agregar('3')">3</button>
    <button class="op" onclick="agregar('+')">+</button>
    <button onclick="agregar('0')">0</button>
    <button onclick="agregar('.')">.</button>
    <button class="igual" onclick="calcular()">=</button>
  </div>
</div>
<script>
  const pantalla = document.getElementById('pantalla');
  let expr = '';

  function mostrar() { pantalla.value = expr || '0'; }
  function agregar(c) { expr += c; mostrar(); }
  function limpiar() { expr = ''; mostrar(); }
  function borrar() { expr = expr.slice(0, -1); mostrar(); }

  function calcular() {
    if (!expr) return;
    // Solo se permiten números y operadores básicos
    if (!/^[0-9+\-*/%.() ]+$/.test(expr)) { expr = ''; pantalla.value = 'Error'; return; }
    try {
      const r = Function('"use strict"; return (' + expr + ')')();
      if (!isFinite(r)) throw new Error();
      expr = String(Math.round(r * 1e10) / 1e10);
      mostrar();
    } catch {
      expr = '';
      pantalla.value = 'Error';
    }
  }

  document.addEventListener('keydown', e => {
    if (/^[0-9+\-*/%.]$/.test(e.key)) agregar(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calcular(); }
    else if (e.key === 'Backspace') borrar();
    else if (e.key === 'Escape') limpiar();
  });
</script>
</body>
</html>
